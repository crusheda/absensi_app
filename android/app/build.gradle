plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.sakudewa.absensi'

    compileSdk 37

    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId 'com.sakudewa.absensi'

        minSdk flutter.minSdkVersion

        targetSdk 37

        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()

            def keystorePropertiesFile =
                    rootProject.file("key.properties")

            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(
                        new FileInputStream(keystorePropertiesFile)
                )
            }

            storeFile file(
                    keystoreProperties['storeFile']
            )

            storePassword keystoreProperties[
                    'storePassword'
            ]

            keyAlias keystoreProperties[
                    'keyAlias'
            ]

            keyPassword keystoreProperties[
                    'keyPassword'
            ]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring \
        'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation platform(
        'com.google.firebase:firebase-bom:34.1.0'
    )

    implementation \
        'com.google.firebase:firebase-analytics'

    implementation \
        'com.google.android.play:integrity:1.3.0'
}